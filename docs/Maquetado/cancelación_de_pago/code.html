<!DOCTYPE html>
<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Cancelación de Pago</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#DC2626", // Red for warning/cancellation
            "background-light": "#F3F4F6", // Light Gray
            "background-dark": "#111827", // Dark Blue/Gray
          },
          fontFamily: {
            display: ["Inter", "sans-serif"],
          },
          borderRadius: {
            DEFAULT: "1rem", // 16px
          },
        },
      },
    };
  </script>
<style>
    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="flex h-screen w-full flex-col p-6 text-center text-gray-900 dark:text-gray-100">
<header class="flex-shrink-0">
<h1 class="text-lg font-semibold text-gray-800 dark:text-gray-200">Cancelación de Pago</h1>
</header>
<main class="flex flex-grow flex-col items-center justify-center">
<div class="mb-6 flex h-20 w-20 items-center justify-center rounded-full bg-primary/10">
<span class="material-symbols-outlined text-4xl text-primary">
          warning
        </span>
</div>
<h2 class="mb-4 text-2xl font-bold text-gray-900 dark:text-white">¿Estás seguro de que quieres cancelar el cobro?</h2>
<div class="mb-8 rounded-lg bg-gray-200/50 dark:bg-gray-800/50 p-4">
<p class="text-lg text-gray-600 dark:text-gray-400">Monto: <span class="font-bold text-gray-900 dark:text-white">$123.45</span></p>
</div>
</main>
<footer class="flex-shrink-0 pb-4">
<div class="flex flex-col space-y-4">
<button class="w-full rounded-DEFAULT bg-primary py-4 text-lg font-semibold text-white transition-opacity hover:opacity-90">
          Sí, Cancelar
        </button>
<button class="w-full rounded-DEFAULT bg-gray-200 dark:bg-gray-700 py-4 text-lg font-semibold text-gray-800 dark:text-gray-200 transition-colors hover:bg-gray-300 dark:hover:bg-gray-600">
          No, Volver
        </button>
</div>
<div class="mt-8 flex justify-center">
<p class="text-sm text-gray-500 dark:text-gray-500">Jeturing</p>
</div>
</footer>
</div>

</body></html>
