<!DOCTYPE html>
<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Enviar Recibo por Correo</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#3b82f6", // A nice blue for the primary action
            "background-light": "#f3f4f6", // Light gray
            "background-dark": "#111827", // Very dark blue-gray
            "surface-light": "#ffffff", // White
            "surface-dark": "#1f2937", // Dark gray
            "text-light": "#1f2937", // Dark gray for text on light background
            "text-dark": "#e5e7eb", // Light gray for text on dark background
            "text-secondary-light": "#6b7280", // Medium gray
            "text-secondary-dark": "#9ca3af", // Lighter medium gray
            "success": "#22c55e", // Green
            "error": "#ef4444" // Red
          },
          fontFamily: {
            display: ["Roboto", "sans-serif"],
          },
          borderRadius: {
            DEFAULT: "1rem", // 16px
          },
        },
      },
    };
  </script>
<style>
    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-text-light dark:text-text-dark">
<div class="flex flex-col h-screen">
<header class="p-4 flex items-center justify-between bg-surface-light dark:bg-surface-dark shadow-sm">
<button class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700">
<span class="material-symbols-outlined">arrow_back_ios_new</span>
</button>
<h1 class="text-lg font-medium">Enviar Recibo por Correo</h1>
<div class="w-10"></div>
</header>
<main class="flex-grow p-6 flex flex-col justify-between">
<div class="space-y-8">
<div>
<label class="block text-sm font-medium text-text-secondary-light dark:text-text-secondary-dark mb-2" for="email">Email del cliente</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-secondary-light dark:text-text-secondary-dark">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-gray-100 dark:bg-gray-800 border-gray-300 dark:border-gray-600 rounded-lg focus:ring-primary focus:border-primary" id="email" name="email" placeholder="ejemplo@correo.com" type="email"/>
</div>
</div>
<div class="hidden flex items-center p-4 rounded-lg bg-success/10 text-success" id="success-message">
<span class="material-symbols-outlined mr-3">check_circle</span>
<p class="font-medium text-sm">Recibo enviado correctamente.</p>
</div>
<div class="hidden flex items-center p-4 rounded-lg bg-error/10 text-error" id="error-message">
<span class="material-symbols-outlined mr-3">error</span>
<p class="font-medium text-sm">Error al enviar. Intente de nuevo.</p>
</div>
</div>
<div class="space-y-8">
<button class="w-full bg-primary text-white py-4 rounded-lg font-bold text-lg hover:opacity-90 transition-opacity">
          Enviar recibo
        </button>
<div class="flex items-center justify-center space-x-2 text-text-secondary-light dark:text-text-secondary-dark">
<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10c.89 0 1.74-.12 2.55-.33A1.996 1.996 0 0 1 13 19.82V19c0-1.1-.9-2-2-2h-2v-2h2c1.1 0 2-.9 2-2v-.18a9.97 9.97 0 0 0 5.66-5.66A9.953 9.953 0 0 0 22 12c0-5.52-4.48-10-10-10zm-2 14v-2h2c.55 0 1 .45 1 1v1h-3zm5-5h-2v-2h2c.55 0 1 .45 1 1v1h-1z" opacity=".3"></path>
<path d="M14.55 21.67c.81.21 1.66.33 2.55.33 5.52 0 10-4.48 10-10 0-3.32-1.62-6.29-4.13-8.16l-1.46 1.46c2.13 1.6 3.59 4.13 3.59 7.07 0 4.97-4.03 9-9 9-.89 0-1.74-.12-2.55-.33A1.996 1.996 0 0 0 13 19.82V19c0-1.1-.9-2-2-2h-2v-2h2c1.1 0 2-.9 2-2v-.18A10 10 0 0 0 12 2c-5.52 0-10 4.48-10 10 0 3.32 1.62 6.29 4.13 8.16l1.46-1.46C5.46 17.07 4 14.54 4 11.61c0-4.97 4.03-9 9-9 .89 0 1.74.12 2.55.33A1.996 1.996 0 0 1 17 4.18V5c0 1.1.9 2 2 2h2v2h-2c-1.1 0-2 .9-2 2v.18A9.97 9.97 0 0 1 11.34 17H7v2h3.54c.58.61 1.28 1.13 2.06 1.55l-1.05 1.05c-.32.32-.32.85 0 1.17.16.16.37.24.57.24s.41-.08.57-.24l1.86-1.86zM9 16v-1c0-.55.45-1 1-1h2v2H9zm5-5v-1c0-.55-.45-1-1-1h-2v2h3z"></path>
</svg>
<span class="font-semibold text-sm">Jeturing</span>
</div>
</div>
</main>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const sendButton = document.querySelector('button');
      const successMessage = document.getElementById('success-message');
      const errorMessage = document.getElementById('error-message');
      let isSuccess = true;
      sendButton.addEventListener('click', () => {
        successMessage.classList.add('hidden');
        errorMessage.classList.add('hidden');
        // Simulate API call
        setTimeout(() => {
          if(isSuccess) {
            successMessage.classList.remove('hidden');
          } else {
            errorMessage.classList.remove('hidden');
          }
          // Alternate for next click
          isSuccess = !isSuccess;
        }, 500);
      });
    });
  </script>

</body></html>
