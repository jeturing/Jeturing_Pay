<html>
  <head>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="" />
    <link
      rel="stylesheet"
      as="style"
      onload="this.rel='stylesheet'"
      href="https://fonts.googleapis.com/css2?display=swap&amp;family=Manrope%3Awght%40400%3B500%3B700%3B800&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900"
    />

    <title>Stitch Design</title>
    <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64," />

  </head>

    <div

      style='font-family: Manrope, "Noto Sans", sans-serif;'
    >
      <div>
        <div class="flex items-center bg-slate-50 p-4 pb-2 justify-between">
          <div class="text-[#0d141b] flex size-12 shrink-0 items-center" data-icon="ArrowLeft" data-size="24px" data-weight="regular">

              <path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>

          </div>

        </div>
        <div class="p-4 @container">
          <div class="flex flex-col items-stretch justify-start rounded-xl @xl:flex-row @xl:items-start shadow-[0_0_4px_rgba(0,0,0,0.1)] bg-slate-50">
            <div
              class="w-full bg-center bg-no-repeat aspect-video bg-cover rounded-xl"
              style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuBqSfphZQd8SAJ9MPRwObZ6-y6bUIdmDsDa8SmtQVXl7pY4HEeivQcAwm5zb6rBhFD0mwkxOuT_TTJDoScLMTgJg9wTOdYm4eT6RvSvwy1taDgQglOx-bR4PXIo5B2PYhnntL-lUa1OXQFDxOLYrIjEC_ZTM2DYoTaZj6MdzFU0jmffNszCG37snYmVelAzsLQw7Bd_ImPF86x7NauKTTSV1eZeUXt-UOYr019F0pP_6e2oKRIYF2X_cavkLH1U2elT2zJC-yn3UrY");'
            ></div>
            <div class="flex w-full min-w-72 grow flex-col items-stretch justify-center gap-1 py-4 @xl:px-4 px-4">
              <p class="text-[#0d141b] text-lg font-bold leading-tight tracking-[-0.015em]">Cobrar con Terminal Físico</p>
              <div class="flex items-end gap-3 justify-between">
                <p class="text-[#4c739a] text-base font-normal leading-normal">Terminal #12345 conectado</p>
                <button
                  class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-full h-8 px-4 bg-[#1380ec] text-slate-50 text-sm font-medium leading-normal"
                >
                  <span class="truncate">Seleccionar</span>
                </button>
              </div>
            </div>
          </div>
        </div>
        <div class="p-4 @container">
          <div class="flex flex-col items-stretch justify-start rounded-xl @xl:flex-row @xl:items-start shadow-[0_0_4px_rgba(0,0,0,0.1)] bg-slate-50">
            <div
              class="w-full bg-center bg-no-repeat aspect-video bg-cover rounded-xl"
              style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuA2kL6l_ndI5EoQtyQEbCyZm4n_w9nE7Gnth5v3EBK8QDK2wQzPgRj31tetzKo6IeTZYxLQogw7GyW8e-8VJxjMXzcxjyTO8oXyait6DwDmvHSeXO9OccFVwhHei43cbzT4DkRqpoNXxDI3g2JH4tc5eIC6NYDK6Z7UR2Ul20PwJfEXxewohqmRYzgHARQkqUekLBiynDR2Ymv32rGYOXt5B5Aj3gYCXfmoO3BMbULmiHeTUr-L6pRfXflKUDcRhpAwZrhVbciRLBw");'
            ></div>
            <div class="flex w-full min-w-72 grow flex-col items-stretch justify-center gap-1 py-4 @xl:px-4 px-4">
              <p class="text-[#0d141b] text-lg font-bold leading-tight tracking-[-0.015em]">Cobrar con Tap to Pay (NFC)</p>
              <div class="flex items-end gap-3 justify-between">
                <p class="text-[#4c739a] text-base font-normal leading-normal">Dispositivo listo para pagos contactless</p>
                <button
                  class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-full h-8 px-4 bg-[#1380ec] text-slate-50 text-sm font-medium leading-normal"
                >
                  <span class="truncate">Seleccionar</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div>
        <div class="flex px-4 py-3">
          <button
            class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-full h-12 px-5 flex-1 bg-[#1380ec] text-slate-50 text-base font-bold leading-normal tracking-[0.015em]"
          >
            <span class="truncate">Continuar</span>
          </button>
        </div>
        <div class="h-5 bg-slate-50"></div>
      </div>
    </div>
  </body>
</html>
